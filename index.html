    <script>
        // Premium Mock Data
        let vaultStock = [
            {
                id: 1,
                name: "1st Edition Base Charizard",
                condition: "PSA 9 MINT",
                price: 8500,
                img: "https://unsplash.com"
            },
            {
                id: 2,
                name: "Shining Tyranitar Neo Destiny",
                condition: "BGS 9.5 GEM",
                price: 1100,
                img: ""
            }
        ];

        let devMode = false;

        function renderVault(itemsToRender = vaultStock) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            itemsToRender.forEach(card => {
                const hasImg = card.img && card.img.trim() !== "";
                const mediaContent = hasImg ? `<img src="${card.img}" alt="${card.name}">` : `<span class="no-img-text">[ Missing Media File ]</span>`;

                grid.innerHTML += `
                    <div class="shop-card">
                        <div class="card-img-box">${mediaContent}</div>
                        <span class="condition-badge">${card.condition}</span>
                        <h3>${card.name}</h3>
                        <div class="price-tag">$${card.price.toLocaleString()}</div>
                        <div class="action-row">
                            <button class="buy-btn">Acquire Asset</button>
                            <button class="delete-btn" id="del-${card.id}" style="display: ${devMode ? 'block' : 'none'}" onclick="purgeCard(${card.id})">✖</button>
                        </div>
                    </div>
                `;
            });
        }

        // FIXED: This now matches the "toggleAdmin()" name in your HTML button!
        function toggleAdmin() {
            const deck = document.getElementById('adminDeck');
            devMode = !devMode;
            deck.style.display = devMode ? 'block' : 'none';
            renderVault();
        }

        function createNewCard(e) {
            e.preventDefault();
            const newAsset = {
                id: Date.now(),
                name: document.getElementById('nameIn').value,
                condition: document.getElementById('gradeIn').value,
                price: parseFloat(document.getElementById('priceIn').value),
                img: document.getElementById('imgIn').value
            };

            vaultStock.push(newAsset);
            renderVault();
            document.getElementById('pokeForm').reset();
        }

        function purgeCard(id) {
            vaultStock = vaultStock.filter(c => c.id !== id);
            renderVault();
        }

        function filterCards() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = vaultStock.filter(c => c.name.toLowerCase().includes(query));
            renderVault(filtered);
        }

        // Run on page load
        renderVault();
    </script>
</body>
</html>
