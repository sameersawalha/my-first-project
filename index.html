<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Styled Website</title>
    <style>
        /* This is where the design magic happens! */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #0070f3; /* Vercel Blue color */
            margin-bottom: 10px;
        }

        p {
            color: #a0a0a0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to My Site</h1>
        <p>I am building this site locally, tracking it with Git, and getting ready to host it on Vercel!</p>
    </div>

</body>
</html>
