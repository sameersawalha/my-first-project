<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeVault Premium</title>
    <style>
        :root {
            --pk-yellow: #ffcb05;
            --pk-blue: #3b4cca;
            --dark-bg: #0b0d11;
            --card-bg: #151922;
            --border-color: #242b3a;
            --neon-green: #00ff66;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            padding: 25px;
            text-align: center;
            border-bottom: 4px solid var(--pk-yellow);
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        header h1 {
            margin: 0;
            font-size: 2.8rem;
            color: var(--pk-yellow);
            text-shadow: 3px 3px 0px var(--pk-blue);
            letter-spacing: 2px;
        }
        header p {
            margin: 8px 0 0 0;
            color: #8e9bb5;
            font-size: 1.1rem;
        }
        .header-controls {
            position: absolute;
            right: 30px;
            top: 35px;
            display: flex;
            gap: 15px;
        }
        .admin-toggle-btn, .cart-toggle-btn {
            background: linear-gradient(135deg, #1e2533, #2d384e);
            color: var(--pk-yellow);
            border: 2px solid var(--pk-yellow);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .controls-bar {
            margin-bottom: 30px;
        }
        .search-input {
            width: 100%;
            padding: 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .admin-panel {
            background: linear-gradient(145deg, #151922, #1c2230);
            border: 2px dashed var(--pk-yellow);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .admin-panel h2 {
            margin-top: 0;
            color: var(--pk-yellow);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 8px;
            color: #8e9bb5;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .form-group input {
            padding: 12px;
            background: #202734;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
        }
        .admin-submit-btn {
            background-color: var(--pk-yellow);
            color: #000;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 35px;
        }
        .shop-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .card-img-box {
            width: 100%;
            height: 280px;
            background-color: #1c2230;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #283144;
        }
        .card-img-box img {
            width: auto;
            height: 100%;
            object-fit: contain;
        }
        .no-img-text {
            color: #4a5468;
            font-size: 0.9rem;
            font-style: italic;
        }
        .condition-badge {
            display: inline-block;
            background: rgba(255, 203, 5, 0.1);
            color: var(--pk-yellow);
            border: 1px solid var(--pk-yellow);
            font-size: 0.8rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 30px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        h3 {
            margin: 5px 0 10px 0;
            font-size: 1.5rem;
            color: #ffffff;
        }
        .price-tag {
            font-size: 1.8rem;
            color: var(--neon-green);
            font-weight: 800;
            margin: 15px 0;
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .buy-link-btn {
            flex: 1;
            background-color: var(--pk-blue);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-link-btn:hover {
            background-color: #2a3795;
        }
        .delete-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background-color: var(--card-bg);
            border-left: 2px solid var(--border-color);
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 1000;
            box-sizing: border-box;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open {
            right: 0;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .cart-header h2 {
            margin: 0;
            color: var(--pk-yellow);
        }
        .close-cart-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1c2230;
        }
        .cart-item-info h4 {
            margin: 0 0 5px 0;
        }
        .cart-item-info p {
            margin: 0;
            color: var(--neon-green);
            font-weight: bold;
        }
        .remove-item-btn {
            background: none;
            border: none;
            color: #ff3333;
            cursor: pointer;
            font-weight: bold;
        }
        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        /* LIVE PRODUCTION CHECKOUT BUTTON STYLING */
        .paypal-live-btn {
            background: #ffc439;
            border-radius: 30px;
            border: none;
            color: #003087;
            font-size: 1.1rem;
            font-weight: bold;
            font-style: italic;
            padding: 14px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }
        .paypal-live-btn:hover {
            background: #e5b033;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <header>
        <h1>PokeVault Store</h1>
        <p>Elite eBay Assets & Certified Grail Collectibles</p>
        <div class="header-controls">
            <button class="cart-toggle-btn" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
            <button class="admin-toggle-btn" onclick="toggleAdmin()">🔧 Control Deck</button>
        </div>
    </header>

    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <button class="close-cart-btn" onclick="toggleCart()">✕</button>
        </div>
        <ul class="cart-items-list" id="cartItemsList"></ul>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total Assessment:</span>
                <span id="cartTotalText">$0</span>
                            </div>
            <button id="checkoutLiveBtn" class="paypal-live-btn" onclick="processLiveCheckout()" style="display: none;">
                PayPal Checkout
            </button>
        </div>
    </div>

    <div class="container">
        <div class="admin-panel" id="adminDeck">
            <h2>Inventory Intake Form</h2>
            <form id="pokeForm" onsubmit="createNewCard(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Card Name</label>
                        <input type="text" id="nameIn" placeholder="Shadowless Charizard" required>
                    </div>
                    <div class="form-group">
                        <label>Grading Tier</label>
                        <input type="text" id="gradeIn" placeholder="PSA 10 GEM MINT" required>
                    </div>
                    <div class="form-group">
                        <label>Market Price (\$)</label>
                        <input type="number" id="priceIn" placeholder="4200" required>
                    </div>
                    <div class="form-group">
                        <label>Image Link</label>
                        <input type="url" id="imgIn" placeholder="Paste URL">
                    </div>
                </div>
                <button type="submit" class="admin-submit-btn">Load Into Live Vault Stock</button>
            </form>
        </div>
        <div class="controls-bar">
            <input type="text" class="search-input" id="searchBox" placeholder="🔍 Search current inventory..." oninput="filterCards()">
        </div>
        <div class="grid" id="cardGrid"></div>
    </div>

    <script>
        const secureKey = "PokeVault2026";
        let vaultStock = [];
        let cart = [];
        let devMode = false;

        function loadVaultData() {
            const savedItems = localStorage.getItem('pokeVaultInventory');
            const savedCart = localStorage.getItem('pokeVaultCart');
            
            if (savedItems) {
                vaultStock = JSON.parse(savedItems);
            } else {
                vaultStock = [
                    {
                        id: 1,
                        name: "1st Edition Base Charizard",
                        condition: "PSA 9 MINT",
                        price: 8500,
                        img: "https://unsplash.com"
                    },
                    {
                        id: 2,
                        name: "Shining Tyranitar Neo Destiny",
                        condition: "BGS 9.5 GEM",
                        price: 1100,
                        img: ""
                    }
                ];
                saveToLocalStorage();
            }

            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            
            renderVault();
            renderCart();
        }

        function saveToLocalStorage() {
            localStorage.setItem('pokeVaultInventory', JSON.stringify(vaultStock));
        }

        function saveCartToStorage() {
            localStorage.setItem('pokeVaultCart', JSON.stringify(cart));
        }

        function renderVault() {
            const grid = document.getElementById('cardGrid');
            const searchTemplate = document.getElementById('searchBox').value.toLowerCase();
            const filteredStock = vaultStock.filter(c => c.name.toLowerCase().includes(searchTemplate));
            grid.innerHTML = '';
            filteredStock.forEach(card => {
                const hasImg = card.img && card.img.trim() !== "";
                const mediaContent = hasImg ? `<img src="${card.img}" alt="${card.name}">` : `<span class="no-img-text">[ Missing Media File ]</span>`;
                const deleteButtonHTML = devMode ? `<button class="delete-btn" onclick="purgeCard(${card.id})">✖</button>` : '';
                grid.innerHTML += `
                    <div class="shop-card">
                        <div class="card-img-box">${mediaContent}</div>
                        <span class="condition-badge">${card.condition}</span>
                        <h3>${card.name}</h3>
                        <div class="price-tag">$${card.price.toLocaleString()}</div>
                        <div class="action-row">
                            <button class="buy-link-btn" onclick="addToCart(${card.id})">Add to Cart</button>
                            ${deleteButtonHTML}
                        </div>
                    </div>
                `;
            });
        }

        function toggleAdmin() {
            const deck = document.getElementById('adminDeck');
            if (!devMode) {
                const attempt = prompt("Enter Administrator Security Passkey:");
                if (attempt !== secureKey) {
                    alert("Access Denied: Invalid Security Signature.");
                    return;
                }
            }
            devMode = !devMode;
            deck.style.display = devMode ? 'block' : 'none';
            renderVault();
        }

        function createNewCard(e) {
            e.preventDefault();
            const newAsset = {
                id: Date.now(),
                name: document.getElementById('nameIn').value,
                condition: document.getElementById('gradeIn').value,
                price: parseFloat(document.getElementById('priceIn').value),
                img: document.getElementById('imgIn').value
            };
            vaultStock.push(newAsset);
            saveToLocalStorage();
            document.getElementById('pokeForm').reset();
            renderVault();
        }

        function purgeCard(id) {
            vaultStock = vaultStock.filter(c => c.id !== id);
            cart = cart.filter(item => item.id !== id);
            saveToLocalStorage();
            saveCartToStorage();
            renderVault();
            renderCart();
        }

        function filterCards() {
            renderVault();
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function addToCart(id) {
            const cardObj = vaultStock.find(c => c.id === id);
            if (cardObj) {
                const alreadyInCart = cart.find(item => item.id === id);
                if (alreadyInCart) {
                    alert("This card is already in your cart.");
                    return;
                }
                cart.push(cardObj);
                saveCartToStorage();
                renderCart();
                document.getElementById('cartDrawer').classList.add('open');
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCartToStorage();
            renderCart();
        }

        function renderCart() {
            const listElement = document.getElementById('cartItemsList');
            const countElement = document.getElementById('cartCount');
            const totalElement = document.getElementById('cartTotalText');
            const liveBtn = document.getElementById('checkoutLiveBtn');
            
            listElement.innerHTML = '';
            let currentTotal = 0;

            cart.forEach(item => {
                currentTotal += item.price;
                listElement.innerHTML += `
                    <li class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>$${item.price.toLocaleString()}</p>
                        </div>
                        <button class="remove-item-btn" onclick="removeFromCart(${item.id})">Remove</button>
                    </li>
                `;
            });

            countElement.innerText = cart.length;
            totalElement.innerText = `$${currentTotal.toLocaleString()}`;
            
            if (cart.length > 0) {
                liveBtn.style.display = "block";
            } else {
                liveBtn.style.display = "none";
            }
        }

        function processLiveCheckout() {
            if (cart.length === 0) return;
            
            let currentTotal = 0;
            cart.forEach(item => { currentTotal += item.price; });
            
            const itemNames = cart.map(item => item.name).join(', ');
            const paypalEmail = "sameersawalha6@gmail.com";
            
            const targetUrl = "https://paypal.com" +
                              "?cmd=_xclick" +
                              "&business=" + encodeURIComponent(paypalEmail) +
                              "&amount=" + currentTotal +
                              "&item_name=" + encodeURIComponent("PokeVault Order: " + itemNames) +
                              "&currency_code=USD" +
                              "&no_shipping=1" + 
                              "&return=" + encodeURIComponent(window.location.href);

            alert(`🔒 Connecting to secure PayPal network for $${currentTotal.toLocaleString()}...`);
            window.location.href = targetUrl;
        }

        loadVaultData();
    </script>
</body>
</html>
